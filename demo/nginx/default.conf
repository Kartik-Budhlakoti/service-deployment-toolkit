server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log off;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    location / {
        set $catalogue_upstream api:8000;
        proxy_pass http://$catalogue_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}
