name: sdt-demo

services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: catalogue_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - catalogue_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue_admin -d catalogue"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    image: sdt-demo-api:phase1
    build: ./demo
    environment:
      DB_HOST: db
      DB_NAME: catalogue
      DB_USER: catalogue_reader
      DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8089:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./demo/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  init:
    image: sdt-demo-api:phase1
    profiles: [tools]
    command: ["python", "db/initialize.py"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  catalogue_data:
